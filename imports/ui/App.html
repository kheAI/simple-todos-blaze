<template name="mainContainer">
  <main class="container">
    <article>
      <header>
        <hgroup>
          <h1>📝️ Todo List</h1>
          <p>{{incompleteCount}} tasks remaining</p>
        </hgroup>
      </header>

      {{#if isUserLoggedIn}}
      <div class="grid user" style="align-items: center; margin-bottom: 1rem">
        <mark>Logged in as: <strong>{{getUser.username}}</strong></mark>
        <div style="text-align: right">
          <button
            id="hide-completed-button"
            class="outline secondary"
            style="width: auto"
          >
            {{#if hideCompleted}} Show All {{else}} Hide Completed {{/if}}
          </button>
        </div>
      </div>

      {{> form }}

      <ul style="list-style: none; padding: 0">
        {{#each tasks}} {{> task}} {{/each}}
      </ul>
      {{else}}
      <div style="text-align: center; padding: 2rem 0">{{> login }}</div>
      {{/if}}
    </article>
  </main>
</template>

<template name="form">
  <form class="task-form">
    <fieldset role="group">
      <input
        type="text"
        name="text"
        placeholder="Type to add new tasks"
        required
      />
      <input type="submit" value="Add" />
    </fieldset>
  </form>
</template>
